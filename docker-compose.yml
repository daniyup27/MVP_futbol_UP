version: '3.9'

# MVP Fútbol UP · entorno reproducible (FPI-III-15)
# Los valores sensibles salen de un archivo .env que no se versiona. Ejemplo de variables:
# POSTGRES_PASSWORD, ANONIMIZATION_SALT (32+ caracteres), JWT_SECRET (32+), APP_VERSION.

services:
  # ============================================
  # Servicio 1: Base de datos PostgreSQL
  # ============================================
  db:
    image: postgres:16-alpine
    container_name: mvp-futbol-up-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-futbol_up}
      POSTGRES_USER: ${POSTGRES_USER:-futbol_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - mvp-network
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-futbol_user} -d ${POSTGRES_DB:-futbol_up}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ============================================
  # Servicio 2: Servidor Node del módulo de bienestar
  # ============================================
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_VERSION: ${APP_VERSION:-sin-version}
    image: mvp-futbol-up:${APP_VERSION:-sin-version}
    container_name: mvp-futbol-up-app
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-futbol_user}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-futbol_up}
      ANONIMIZATION_SALT: ${ANONIMIZATION_SALT}
      JWT_SECRET: ${JWT_SECRET}
      PARTIDOS_FINALIZADOS: ${PARTIDOS_FINALIZADOS:-partido-demo-1,partido-demo-2}
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - mvp-network

volumes:
  postgres_data:
    driver: local
    labels:
      description: "Datos persistentes de PostgreSQL - MVP Fútbol UP"

networks:
  mvp-network:
    driver: bridge
    labels:
      description: "Red aislada para MVP Fútbol UP"
