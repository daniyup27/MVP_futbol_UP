name: CI Pipeline - MVP Fútbol UP

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  # Job 1: Verificación básica de estructura
  lint:
    name: Verificación de estructura
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Verificar existencia de archivos críticos
        run: |
          echo "✅ Verificando estructura del proyecto..."
          test -f package.json && echo "✅ package.json existe" || echo "⚠️ package.json no encontrado"
          test -d src && echo "✅ Carpeta src existe" || echo "⚠️ Carpeta src no encontrada"
          echo "✅ Job de lint completado (estructura base)"

  # Job 2: Verificación de pruebas (placeholder)
  test:
    name: Suite de pruebas
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18.x'

      - name: Verificar existencia de pruebas
        run: |
          echo "✅ Buscando archivos de pruebas..."
          find src -name "*.test.ts" -o -name "*.test.js" | head -10 || echo "⚠️ No se encontraron pruebas aún"
          echo "✅ Job de tests completado (placeholder hasta configurar Jest)"

  # Job 3: Análisis estático (placeholder)
  sonarcloud:
    name: Análisis SonarCloud
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Placeholder para SonarCloud
        run: |
          echo "⚠️ SonarCloud no configurado aún"
          echo "📋 Pendiente: Configurar SONAR_TOKEN en GitHub Secrets"
          echo "📋 Pendiente: Crear proyecto en SonarCloud"
          echo "✅ Job de análisis completado (placeholder documentado)"
